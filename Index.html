<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HySky Recarga - Recargas a Cuba</title>
    <!-- SDK de Stripe para pagos -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #004c99;
            --accent-color: #ff9800;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        /* Barra superior para autenticación opcional */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .auth-widget {
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-widget button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .auth-widget button.secondary {
            background: #e2e8f0;
            color: #333;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-logo span {
            color: var(--accent-color);
        }

        .header p {
            color: #666;
            font-size: 1.05rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        .service-type {
            display: flex;
            gap: 15px;
            margin-bottom: 24px;
        }

        .service-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .service-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #eef6ff;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }

        .input-control {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: var(--primary-color);
        }

        .phone-input {
            display: flex;
            align-items: center;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .phone-input:focus-within {
            border-color: var(--primary-color);
        }

        .prefix {
            background-color: #eef2f5;
            padding: 14px 18px;
            font-weight: bold;
            color: #444;
            border-right: 1px solid #ccc;
        }

        .phone-input input {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 12px;
            margin-bottom: 24px;
        }

        .plan-card {
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            padding: 18px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            background: #fff;
        }

        .plan-card:hover {
            border-color: var(--primary-color);
        }

        .plan-card.selected {
            border-color: var(--primary-color);
            background-color: #f8fbff;
            box-shadow: 0 0 0 2px var(--primary-color);
        }

        .badge {
            position: absolute;
            top: -10px;
            right: 15px;
            background: var(--accent-color);
            color: white;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .plan-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .plan-details {
            font-size: 0.88rem;
            color: #555;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .plan-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .plan-price .old-price {
            font-size: 0.9rem;
            text-decoration: line-through;
            color: #999;
            margin-right: 6px;
            font-weight: 400;
        }

            width: 10
